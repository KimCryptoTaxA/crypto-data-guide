name: Daily source check

on:
  schedule:
    - cron: "17 0 * * *"   # every 24 hours, 08:17 Philippine time (00:17 UTC)
  workflow_dispatch:        # "Run workflow" button for an on-demand check

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check CoinTracking pages for IP and instruction changes
        id: check
        run: python scripts/check_sources.py
        env:
          DEBUG_IPS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Open a change request for approval
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: daily-check
          delete-branch: true
          add-paths: |
            index.html
            checker/fingerprints.json
          commit-message: ${{ steps.check.outputs.title }}
          title: ${{ steps.check.outputs.title }}
          body-path: ${{ steps.check.outputs.report }}

      - name: Flag pages that need a manual look
        if: steps.check.outputs.needs_attention == 'true' && steps.check.outputs.changed != 'true'
        run: echo "::warning::Some pages need a manual look - see the run summary."
